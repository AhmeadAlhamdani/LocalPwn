[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localpwn-assessor"
version = "1.0.0rc1"
description = "Local-first authorized network assessment with dashboard, evidence, and optional AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=7.4", "httpx>=0.24"]
pdf = ["reportlab>=4.0"]
full = ["fastapi>=0.110", "uvicorn>=0.27", "reportlab>=4.0"]

[project.scripts]
localpwn = "localpwn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localpwn = ["static/*.html", "static/*.xml"]
